# Tool inventory for probe tools.inventory, shared by envscan.ps1 and envscan.sh.
#
# Fields (inline tables, one per line)
#   id    unique id (lowercase, [a-z0-9_-])
#   name  display name
#   cat   runtime | build | vcs | container | cloud | db | pkg | editor | shell | net | archive | util | windows
#   exe   executable names to look for, in order (no extension; Windows adds PATHEXT)
#   args  version arguments; [] = run with no arguments. No argument may contain spaces.
#   mode  "version" (default): run exe + args with a timeout, from the filesystem root
#         "presence": never executed, only located
#   os    all (default) | windows | unix | linux | darwin
#   dirs  extra directories searched when the tool is not on PATH. Placeholders:
#         ~ = home, {env:NAME} = environment variable (entry skipped when unset),
#         * = glob. Forward slashes only; Windows converts them.
#
# A found executable is never run when it is a version-manager shim (see
# [[version_manager]] below), a .ps1 script, a 0-byte WindowsApps alias, a macOS
# /usr/bin developer-tools shim without the Command Line Tools, or a WSL /mnt/*
# Windows binary. Such tools are reported with executed = false and a reason.

