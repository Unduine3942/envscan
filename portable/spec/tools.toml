# Version managers. Executables in a directory matching a marker (lower-case,
# forward-slash substring of the directory path) are shims and are never run;
# when `requires` is set, the directory must also contain that executable.
# `versions` globs list installed versions (directory names are the versions).
version_managers = [
  { id = "rustup", name = "rustup", markers = ["/.cargo/bin"], requires = "rustup", versions = ["~/.rustup/toolchains/*", "{env:RUSTUP_HOME}/toolchains/*"] },
  { id = "volta", name = "Volta", markers = ["/.volta/bin", "/volta/bin"], versions = ["~/.volta/tools/image/node/*", "{env:LOCALAPPDATA}/Volta/tools/image/node/*", "{env:VOLTA_HOME}/tools/image/node/*"] },
  { id = "asdf", name = "asdf", markers = ["/.asdf/shims"], versions = ["~/.asdf/installs/*/*", "{env:ASDF_DATA_DIR}/installs/*/*"] },
  { id = "mise", name = "mise", markers = ["/mise/shims"], versions = ["~/.local/share/mise/installs/*/*", "{env:LOCALAPPDATA}/mise/installs/*/*", "{env:MISE_DATA_DIR}/installs/*/*"] },
  { id = "pyenv", name = "pyenv", markers = ["/.pyenv/shims", "/pyenv-win/shims"], versions = ["~/.pyenv/versions/*", "~/.pyenv/pyenv-win/versions/*", "{env:PYENV_ROOT}/versions/*"] },
  { id = "rbenv", name = "rbenv", markers = ["/.rbenv/shims"], versions = ["~/.rbenv/versions/*"] },
  { id = "nodenv", name = "nodenv", markers = ["/.nodenv/shims"], versions = ["~/.nodenv/versions/*"] },
  { id = "jenv", name = "jenv", markers = ["/.jenv/shims"], versions = ["~/.jenv/versions/*"] },
  { id = "goenv", name = "goenv", markers = ["/.goenv/shims"], versions = ["~/.goenv/versions/*"] },
  { id = "tfenv", name = "tfenv", markers = ["/.tfenv/bin"], versions = ["~/.tfenv/versions/*"] },
  { id = "proto", name = "proto", markers = ["/.proto/shims", "/.proto/bin"], versions = ["~/.proto/tools/*/*"] },
  { id = "nvm", name = "nvm", markers = [], versions = ["~/.nvm/versions/node/*", "{env:NVM_DIR}/versions/node/*", "{env:NVM_HOME}/v*"] },
  { id = "fnm", name = "fnm", markers = [], versions = ["~/.local/share/fnm/node-versions/*", "{env:APPDATA}/fnm/node-versions/*", "{env:FNM_DIR}/node-versions/*"] },
  { id = "sdkman", name = "SDKMAN!", markers = [], versions = ["~/.sdkman/candidates/*/*"] },
  { id = "uv-python", name = "uv-managed Python", markers = [], versions = ["~/.local/share/uv/python/*", "{env:APPDATA}/uv/python/*"] },
]
