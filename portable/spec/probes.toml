scope = "machine"
about = "Full socket table via netstat where no quiet source exists."

[[probe]]
id = "net.firewall"
title = "Host firewall"
tier = "default"
scope = "machine"
about = "Host firewall state where readable without admin rights."

[[probe]]
id = "net.reachability"
title = "Reachability of configured internal endpoints"
tier = "net"
scope = "process"
about = "DNS and TCP checks against proxies and mirrors found in local configuration only."

[[probe]]
id = "fs.mounts"
title = "Mounts and mount options"
tier = "default"
scope = "machine"
about = "File systems and options (noexec, nosuid, ro) for temp, shared memory, home and root."

[[probe]]
id = "fs.locations"
