[[probe]]
id = "runtime.java"
title = "Java installations"
tier = "default"
scope = "mixed"
about = "JDKs and JREs found via JAVA_HOME, PATH and known locations (from their release files)."

[[probe]]
id = "tls.java_cacerts"
title = "Java truststore contents"
tier = "deep"
scope = "machine"
about = "Whether the JDK truststore contains the enterprise roots (runs keytool)."

[[probe]]
id = "runtime.dotnet"
title = ".NET runtimes"
tier = "default"
scope = "machine"
about = ".NET Framework release, .NET SDKs and runtimes."

[[probe]]
id = "runtime.python"
title = "Python interpreters"
tier = "default"
scope = "mixed"
about = "Python interpreters if any, including Windows Store aliases and the py launcher."

[[probe]]
id = "toolchain.msvc"
title = "Visual Studio and Windows SDK"
tier = "default"
scope = "machine"
about = "Visual Studio instances (vswhere), Windows SDKs and MSBuild."

[[probe]]
id = "native.deps"
title = "Native libraries and drivers"
tier = "default"
scope = "machine"
about = "C runtime (glibc, musl, UCRT), libstdc++, OpenSSL, VC++ redistributables, WebView2, ODBC drivers."

[[probe]]
id = "net.interfaces"
title = "Network interfaces"
tier = "default"
scope = "machine"
about = "Interfaces, addresses, MTU, gateways and DNS servers."

[[probe]]
id = "net.routes"
title = "Routing"
tier = "default"
scope = "machine"
about = "Default gateways and routing table."

[[probe]]
id = "net.dns"
