tier = "default"
scope = "user"
about = "Which candidate install, temp and data directories this user can write, and their free space."

[[probe]]
id = "fs.semantics"
title = "File system semantics"
tier = "default"
scope = "mixed"
about = "Case sensitivity, symlink and hard link creation, long paths, short names, name length limits."

[[probe]]
id = "fs.exec_test"
title = "Execution test in writable locations"
tier = "deep"
scope = "user"
about = "Writes and runs a trivial script in each writable location (may log application-control events)."

[[probe]]
id = "proc.list"
title = "Running processes"
tier = "default"
scope = "machine"
about = "Process inventory (only this user's command lines are visible)."

[[probe]]
id = "svc.list"
