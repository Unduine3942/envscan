# Footprint of the envscan.cmd fallback collector (runs only when PowerShell is
# missing, blocked, or its execution policy forbids the script, or with --fallback).
# A probe is implemented by the fallback if and only if it is listed here.
# Vocabulary: "run <command>" external process (absolute System32 path, cwd %SystemDrive%\,
# never anything from PATH); "reg query <key>" registry read; "write <path>" file
# create/delete; "list" directory listing. Values are redacted per spec/redaction.toml.
# Programs write their output to a temporary capture file that FOR /F reads back
# (envscan-launch-<digits>.out in the user's TEMP folder, else envscan-capture.tmp in the
# output folder) instead of a FOR /F child cmd.exe, which would run the AutoRun commands of
# the registry (used only where no capture file exists yet, or noted); the file is deleted
# before envscan.cmd ends.

"os.identity" = ['run ver', 'reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion" (ProductName, DisplayVersion, ReleaseId, EditionID, InstallationType, CurrentBuild, CurrentBuildNumber, UBR, CurrentMajorVersionNumber, CurrentMinorVersionNumber, BuildLabEx)', 'environment PROCESSOR_ARCHITECTURE, PROCESSOR_ARCHITEW6432, OS']
"os.time_locale" = ['reg query "HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation"', 'run tzutil /g', 'reg query "HKCU\Control Panel\International"', 'reg query "HKLM\SYSTEM\CurrentControlSet\Control\Nls\CodePage"', 'run chcp.com']
"hw.cpu" = ['reg query "HKLM\HARDWARE\DESCRIPTION\System\CentralProcessor" (subkeys; ProcessorNameString, VendorIdentifier, Identifier, ~MHz of CPU 0)', 'environment NUMBER_OF_PROCESSORS, PROCESSOR_IDENTIFIER, PROCESSOR_LEVEL, PROCESSOR_REVISION']
"user.identity" = ['environment USERNAME, USERDOMAIN, USERDNSDOMAIN, USERPROFILE, HOMEDRIVE, HOMEPATH, HOMESHARE, LOGONSERVER', 'run whoami (no options, so no group or domain lookups)', 'reg query HKU\S-1-5-19 (readable only with an elevated token; output discarded)']
"env.vars" = ['run set, its output written to the temporary capture file in your TEMP folder and emptied right after reading; only the names are taken from it, each value is read from the environment (values of secret-looking names, URL passwords and user:password@host credentials are redacted)', 'when only the output folder can hold the capture file, set runs in a cmd.exe child (FOR /F) instead, so the unredacted list is never written there', 'line breaks inside values are shown as <CR> and <LF>; a value longer than cmd.exe can read (about 8000 characters) is reported as not shown', 'run copy /z envscan.cmd nul into the capture file (a cmd.exe built-in; its progress line gives the carriage return character)']
"env.path" = ['environment PATH; each directory on a local volume tested with if exist (network, relative, unexpanded and non-local entries are not touched)', 'reg query machine and user Path values ("HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment", HKCU\Environment)', 'run mountvol and subst (which drive letters are local volumes)']
"shell.info" = ['environment COMSPEC, PATHEXT, __PSLockdownPolicy, PSExecutionPolicyPreference', 'reg query PowerShell engine keys (HKLM\SOFTWARE\Microsoft\PowerShell\1 and \3, PowerShellCore\InstalledVersions)', 'reg query execution policy keys (HKLM and HKCU Policies\Microsoft\Windows\PowerShell and ShellIds\Microsoft.PowerShell)', 'read the Zone.Identifier stream and signature block of envscan.ps1 (findstr)', 'reg query HKCU Policies\Microsoft\Windows\System DisableCMD, Command Processor AutoRun (HKCU, HKLM), Windows Script Host Settings Enabled (HKCU, HKLM)', 'only when Windows PowerShell is missing: list %ProgramFiles%\PowerShell\<number> and the local PATH directories for pwsh.exe (never WindowsApps)']
"sec.app_control" = ['environment __PSLockdownPolicy', 'reg query /s HKLM\SOFTWARE\Policies\Microsoft\Windows\SrpV2 (AppLocker EnforcementMode)', 'reg query Policies\Microsoft\Windows\Safer\CodeIdentifiers (HKLM, HKCU)', 'reg query HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy and DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity', 'list %SystemRoot%\System32\CodeIntegrity\CiPolicies\Active\*.cip']
"pkg.installed" = ['reg query /s of the 64-bit, 32-bit (WOW6432Node) and per-user ...\CurrentVersion\Uninstall keys, written to the capture file; only DisplayName and DisplayVersion are taken from it']
"tools.inventory" = ['list each local PATH directory for the executables in spec/tools.toml with the PATHEXT extensions (presence only, nothing is executed)', 'run mountvol and subst (which drive letters are local volumes)']
"runtime.dotnet" = ['reg query "HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP" (v4\Full Release and Version, subkeys)', 'list shared\*\* and sdk\* under %ProgramFiles%\dotnet, %ProgramFiles(x86)%\dotnet, %LOCALAPPDATA%\Microsoft\dotnet, %USERPROFILE%\.dotnet and %DOTNET_ROOT% (local volumes only; network and other non-local paths are reported, not listed)', 'run mountvol and subst (which drive letters are local volumes)']
"net.interfaces" = ['run ipconfig /all']
"net.routes" = ['run route print']
"net.proxy" = ['environment proxy variables (spec/configs.toml proxy_env)', 'reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings"; the HKLM key too when ProxySettingsPerUser is 0', 'run netsh winhttp show proxy']
"fs.locations" = ['write and delete one temporary file in %TEMP%, %LOCALAPPDATA%, %LOCALAPPDATA%\Programs, %APPDATA%, %USERPROFILE%, %ProgramData%, current directory, script directory (never network or non-local locations, Desktop, Documents, their redirected folders or OneDrive)', 'reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders" and "...\Explorer\Shell Folders" (Desktop, Personal); environment OneDrive, OneDriveCommercial, OneDriveConsumer', 'run mountvol and subst (which drive letters are local volumes)']
"session.context" = ['environment SESSIONNAME, CLIENTNAME, WT_SESSION, TERM_PROGRAM, TERM, ConEmuANSI', 'run chcp']
