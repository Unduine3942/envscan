# Footprint of envscan.sh: exactly what each probe reads or runs.
# A probe is implemented by envscan.sh if and only if it is listed here.
# Vocabulary: "read <path>" file read; "list <path>" directory listing; "test <path>" existence
# or permission test; "write <path>" file create/delete; "run <command>" external process
# (cwd /, stdin /dev/null, spec/child_env.toml applied, LC_ALL=C except the locale commands of
# os.time_locale, --timeout watchdog).
# All reads honour the test-only ENVSCAN_ROOT prefix (reported in run.test_root).
# Shared at scan start (not repeated per probe): run head -n 1 on the script itself (CRLF check; a
# CRLF copy is rewritten with tr -d '\r' into a new private temp directory and re-run from there);
# run uname -s -n -r -m; read /proc/self/mounts or /proc/mounts (fallback run mount, mount -p on
# Solaris/HP-UX); run printf A | od -An -tx1 (EBCDIC check; z/OS UNIX and IBM i QSH are EBCDIC); on z/OS
# the report files are converted with iconv -f IBM-1047 -t UTF-8 (only when printf [ gives byte ad; the copy is written below the private temp directory, checked for line feeds and for envscan.json starting with a brace, then moved into place) and tagged with chtag -tc 1208 (unverified); IBM i
# PASE: /QNTC and /QFileSvr.400 count as network paths and are never touched (z/OS and IBM i are tier 2,
# best effort, unverified); the original environment from awk's ENVIRON (kept in memory, never written to
# disk); process PATH (version-manager shim directories). The private temp directory is created
# in TMPDIR, /tmp, /var/tmp or HOME, never on a network or autofs mount (where /proc/self/mounts
# exists it is read before the directory is created).
# Every path that comes from the environment, HOME, a glob or a symbolic link is vetted against
# the mount table before any test or read: nothing on a network or autofs mount is touched, and
# credential stores (~/.ssh, ~/.aws, ~/.kube, .netrc, .git-credentials, auth.json,
# ~/.docker/config.json, shell history) are never listed, tested or read.
# Network and autofs mounts (from the mount table) are never touched: PATH entries there are not
# searched, configuration paths there are not read or globbed (the probe notes them), no write
# test is made there, and the default output folder skips them.

"os.identity" = ['run uname -s -n -r -m (at scan start), uname -v, uname -p (never on z/OS, where -p is not documented)', 'run uname -Ia (z/OS: the z/OS name, release and version; plain uname gives the OS/390-compatible identity; raw output kept; unverified)', 'read /etc/os-release, /usr/lib/os-release, /etc/lsb-release, /etc/redhat-release, /etc/debian_version, /etc/alpine-release, /etc/release (Solaris)', 'read /proc/version, /proc/sys/kernel/osrelease', 'run sw_vers, sysctl -n sysctl.proc_translated (macOS)', 'run oslevel -s (AIX)', 'run getconf LONG_BIT', 'read /etc/hosts (own host name), /etc/resolv.conf (domain line)', 'test /etc/krb5.conf, /etc/sssd/sssd.conf (presence only)']
"os.time_locale" = ['environment TZ, LANG, LANGUAGE, LC_*', 'read /etc/timezone, /etc/localtime link target', 'read /proc/registry/HKEY_LOCAL_MACHINE/SYSTEM/CurrentControlSet/Control/TimeZoneInformation/TimeZoneKeyName, Nls/CodePage/ACP, Nls/CodePage/OEMCP (Cygwin/MSYS)', 'run date +%z', 'run locale, locale charmap, locale -k decimal_point d_fmt', 'run locale -a (UTF-8 availability only)']
"os.health" = ['read /proc/uptime, /proc/loadavg', 'run sysctl -n kern.boottime, sysctl -n vm.loadavg (macOS/BSD)', 'run uptime (other systems without /proc/uptime)', 'test /var/run/reboot-required, /run/reboot-required; read reboot-required.pkgs', 'list /lib/modules (installed kernels, Linux)']
"hw.cpu" = ['read /proc/cpuinfo', 'run sysctl -n machdep.cpu.brand_string machdep.cpu.vendor machdep.cpu.features machdep.cpu.leaf7_features hw.ncpu hw.physicalcpu hw.packages hw.optional.neon hw.optional.arm.FEAT_AES (macOS)', 'run sysctl -n hw.model hw.ncpu hw.machine_arch (BSD)', 'run getconf _NPROCESSORS_ONLN']
"hw.memory" = ['read /proc/meminfo', 'run sysctl -n hw.memsize, sysctl -n vm.swapusage, vm_stat (macOS)', 'run sysctl -n hw.physmem (BSD)', 'run lsattr -El sys0 -a realmem (AIX)', 'run prtconf (Solaris)', 'run getconf _PHYS_PAGES, getconf PAGESIZE (fallback)']
"hw.storage" = ['run df -P -k -l (fallback df -P -k <local mount points>; z/OS: only df -P -k on mount points whose type is known and local, never plain df, which also asks NFS servers)', 'mount table read at scan start (file system types)', 'read /sys/block/<device>/removable']
"hw.gpu" = ['run nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader (when present)', 'run system_profiler SPDisplaysDataType (macOS)', 'run lspci (other systems, when present; display controllers only)', 'list /dev/dri']
"limits.process" = ['read /proc/self/limits', 'shell builtin ulimit -a, -Sn, -Hn, -Su/-Sp, -Hu/-Hp, -Ss, -Sc, -Sl, -Sv']
"limits.kernel" = ['read /proc/sys/fs/{file-max,file-nr,inotify/max_user_watches,inotify/max_user_instances}, /proc/sys/vm/{max_map_count,overcommit_memory,swappiness}, /proc/sys/kernel/{pid_max,threads-max,yama/ptrace_scope,unprivileged_userns_clone,perf_event_paranoid}, /proc/sys/user/max_user_namespaces, /proc/sys/net/core/somaxconn', 'run sysctl kern.maxfiles kern.maxfilesperproc kern.maxproc kern.maxprocperuid kern.ipc.somaxconn (systems without /proc/sys)', 'read /sys/kernel/mm/transparent_hugepage/enabled', 'read /etc/security/limits.conf, /etc/security/limits.d/*.conf', 'read /etc/systemd/system.conf, /etc/systemd/user.conf (DefaultLimit*)']
"limits.cgroup" = ['read /proc/self/cgroup', 'read cgroup v2 memory.max, cpu.max, pids.max (own cgroup and its parents)', 'read cgroup v1 memory.limit_in_bytes, cpu.cfs_quota_us, cpu.cfs_period_us, pids.max']
"net.ports" = ['read /proc/sys/net/ipv4/ip_local_port_range, ip_unprivileged_port_start, ip_local_reserved_ports', 'run sysctl -n net.inet.ip.portrange.first net.inet.ip.portrange.last (macOS/BSD)']
"user.identity" = ['run id', 'run getent passwd <own uid> (fallback: read /etc/passwd, own uid only)', 'environment HOME, SHELL, USER, LOGNAME']
"user.profile" = ['environment HOME, XDG_*', 'mount table read at scan start (file system of HOME)', 'test HOME (directory, writable; not when it is on a network or autofs mount)', 'read ~/.config/user-dirs.dirs (not on a network or autofs mount)']
"user.privileges" = ['run sudo -n -l (never prompts; may be logged)', 'run system "DSPSYSVAL SYSVAL(QSECURITY)", system "DSPSYSVAL SYSVAL(QCCSID)", system "DSPSYSVAL SYSVAL(QTIMZON)", system "DSPSYSVAL SYSVAL(QLANGID)" (IBM i, display only; raw output)']
"env.vars" = ['process environment (awk ENVIRON, captured in memory at scan start; names come from the environment, never from value lines)']
"env.path" = ['process PATH', 'test each PATH entry (directory, writable; local file systems only, also through links)']
"shell.info" = ['environment SHELL', 'read /etc/shells', 'list /bin/sh link target', 'run bash --version, zsh --version (when present)', 'umask at scan start']
"shell.userland" = ['run sed --version, awk --version, grep --version, tar --version, date --version, find --version (failures identify BSD/busybox variants)', 'run awk -W version (when awk --version is not recognised)', 'list /bin/busybox link targets']
"sec.app_control" = ['read /sys/fs/selinux/enforce, /etc/selinux/config', 'read /sys/module/apparmor/parameters/enabled, /proc/self/attr/apparmor/current, /proc/self/attr/current', 'read /proc/self/status (Seccomp, NoNewPrivs, CapEff)', 'list /etc/fapolicyd', 'run systemctl is-active fapolicyd (when fapolicyd is installed)', 'read /sys/kernel/security/lockdown', 'mount table read at scan start (root read-only)', 'run csrutil status, spctl --status, profiles status -type enrollment (macOS)']
"sec.crypto" = ['read /proc/sys/crypto/fips_enabled', 'read /etc/crypto-policies/config', 'run openssl version -a', 'environment OPENSSL_CONF']
"tls.trust" = ['read CA bundles listed in spec/configs.toml (certificate count)', 'list custom anchor directories from spec/configs.toml', 'run openssl x509 -noout -subject -enddate -in <anchor> (each locally added anchor)', 'environment TLS variables', 'run security dump-trust-settings -d (macOS: admin trust settings, certificate names only; the System keychain is not opened)', 'list $JAVA_HOME/lib/security/cacerts (size and date)']
"tls.java_cacerts" = ['test $JAVA_HOME/bin/keytool (not on a network or autofs mount)', 'run keytool -list -v -cacerts -storepass changeit (fallback -keystore <java home>/lib/security/cacerts)']
"pkg.sources" = ['read package-manager and repository config files from spec/configs.toml (redacted)', 'environment package variables', 'run git config --list --show-origin --no-includes (fallback git config --list --no-includes, then git config --list for a git before 1.7.10) in a new empty directory under the scanner temp directory, GIT_CEILING_DIRECTORIES set, GIT_DIR and GIT_WORK_TREE unset; a HOME, XDG_CONFIG_HOME, GIT_CONFIG_GLOBAL or GIT_CONFIG_SYSTEM on a network or autofs mount is replaced for git by an empty local directory', 'run git config --list --no-includes --file <include> for each unconditional include.path on a local path, one level deep, each file once (includes on network or autofs mounts, credential stores, ~user/ and %(prefix)/ paths, nested includes and includeIf are never read, only noted)']
"pkg.caches" = ['list cache directories from spec/configs.toml (ls -A; top-level entry counts, at most 10000 per directory, then truncated)']
"pkg.installed" = ['run dpkg-query -W, rpm -qa, apk info -v, pacman -Q, brew list --versions (whichever exist)', 'run pkgutil --pkgs (macOS), pkg info (FreeBSD), lslpp -Lc (AIX), pkg list -H (Solaris)', 'list /Applications (macOS)']
"tools.inventory" = ['test PATH directories and the known install directories in spec/tools.toml', 'run <tool> <version args> for each found tool (spec/tools.toml), cwd = /, stdin = /dev/null, timeout; never version-manager shims (decided by the directory that holds the file, however it was found), Windows app aliases, presence-only tools or binaries on network or autofs mounts', 'read the first 512 bytes of each found executable (ELF/Mach-O/PE machine type)', 'test the install directories of the OS besides the spec ones: /usr/lpp/java/*/bin, /usr/lpp/IBM/cyp/*/bin, /usr/lpp/IBM/cnj/*/bin, /usr/lpp/IBM/zoautil/bin, /usr/local/zopen/*/bin, /usr/local/bin (z/OS); /QOpenSys/pkgs/bin, /QOpenSys/usr/bin, /QOpenSys/QIBM/ProdData/JavaVM/*/*/bin, /QOpenSys/pkgs/lib/jvm/*/bin (IBM i)']
"runtime.version_managers" = ['list the version directories in spec/tools.toml (no shim is executed)', 'process PATH (entries that are version-manager shim directories)']
"runtime.java" = ['read <jdk>/release for JAVA_HOME, PATH java and the known JDK directories (/usr/lib/jvm/*, /usr/java/*, /opt/*jdk*, /opt/java/*, /Library/Java/JavaVirtualMachines/*, ~/Library/Java/JavaVirtualMachines/*, ~/.sdkman/candidates/java/*, ~/.jdks/*, /usr/lpp/java/* (z/OS), /QOpenSys/QIBM/ProdData/JavaVM/*/*bit and /QOpenSys/pkgs/lib/jvm/* (IBM i); Program Files JDK directories on Cygwin/MSYS; nothing on a network or autofs mount, also through links)', 'run java -XshowSettings:properties -version (only when PATH java is a launcher stub)', 'run /usr/libexec/java_home -V (macOS)']
"runtime.dotnet" = ['run dotnet --list-sdks, dotnet --list-runtimes (when present and not a shim)', 'test $DOTNET_ROOT/dotnet and the known dotnet directories (not on a network or autofs mount)', 'list <dotnet root>/sdk, <dotnet root>/shared (when dotnet is not executed)']
"runtime.python" = ['test PATH and known locations for python3, python, python2, python3.N (not on network or autofs mounts: no glob or test there)', 'run <python> --version (never shims, Windows app aliases or binaries on network or autofs mounts)']
"native.deps" = ['run getconf GNU_LIBC_VERSION, ldd --version', 'list /lib/ld-musl-*', 'run ldconfig -p (Linux)', 'list /lib*, /usr/lib*, /usr/local/lib for libssl and libstdc++', 'read libstdc++.so.6 (GLIBCXX version strings)', 'read /etc/odbcinst.ini', 'run fc-list (count only; XDG_CACHE_HOME in the scanner temp directory, so no cache is written to HOME)']
"net.interfaces" = ['run ip -o link, ip -o addr (fallback ifconfig -a, then read /proc/net/dev)', 'run onetstat -h (z/OS; raw output only)', 'read /proc/net/route (default gateways)', 'read the first 6 bytes of /proc/self/exe (byte order of /proc/net/route)']
"net.routes" = ['run ip route and ip -6 route (fallback read /proc/net/route, then route -n get default and route -n get -inet6 default)', 'read /proc/net/ipv6_route (when ip -6 route did not run)', 'on-link, multipath nexthop and 0/1 + 128/1 full-tunnel routes count as default routes; no default route is concluded only when both address families were checked (a missing or failing route command leaves its family unchecked)', 'read the first 6 bytes of /proc/self/exe (byte order of /proc/net/route)']
"net.dns" = ['read /etc/resolv.conf, /run/systemd/resolve/resolv.conf (behind the systemd-resolved stub), /etc/nsswitch.conf, /etc/hosts', 'run scutil --dns (macOS)']
"net.proxy" = ['environment proxy variables', 'read /etc/environment, /etc/apt/apt.conf, /etc/apt/apt.conf.d/*, /etc/yum.conf, /etc/dnf/dnf.conf (proxy settings, found by setting name)', 'run scutil --proxy (macOS)', 'package-manager proxy settings found by pkg.sources']
"net.listening" = ['read /proc/net/tcp, /proc/net/tcp6 (LISTEN state)', 'read the first 6 bytes of /proc/self/exe (byte order of the addresses)']
"net.netstat" = ['run netstat -an (fallback ss -an)']
"net.firewall" = ['read /etc/ufw/ufw.conf', 'run systemctl is-active firewalld nftables iptables', 'run /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate (macOS)']
"net.reachability" = ['DNS lookup (getent ahosts <host>, fallback getent hosts; dscacheutil -q host -a name <host> on macOS; at most 5 s) and TCP connect (3 s) to a vetted address of at most 20 proxy and internal mirror hosts found in net.proxy and pkg.sources only, via curl -q telnet://<address>:<port> --noproxy or nc -z <address> <port> when present; stopping before the scan budget ends; an IPv6 address only in 2000::/3 and fc00::/7, never in fd00:ec2::/32 or with a zone id', 'never public registries (spec public_hosts: not even looked up) or cloud metadata and link-local hosts (spec net_never: checked on the name before any lookup and on every resolved address); a name is not contacted when no resolver can vet it; only plain host names (letters, digits, . _ -) and IP addresses']
"fs.mounts" = ['mount table read at scan start (/proc/self/mounts, /proc/mounts, else run mount)']
"fs.locations" = ['create and remove one new test directory (mkdir of a unique name) in each candidate directory ($TMPDIR, /tmp, /var/tmp, /dev/shm, $HOME, $HOME/.local, $HOME/bin, /opt, /usr/local, current directory, script directory); never in Desktop, Documents, the XDG Desktop/Documents directories, cloud-synchronised folders or on network/autofs mounts (not even an existence test there)', 'read ~/.config/user-dirs.dirs (XDG Desktop/Documents)', 'run df -P -k on each candidate']
"fs.semantics" = ['create a new private directory under the scanner temp directory, write test files there (case sensitivity) and remove it', 'run ln -s, ln (in that directory)', 'run getconf NAME_MAX, PATH_MAX']
"fs.exec_test" = ['per-user directories only: create a new directory in the scanner temp directory and under $HOME, ~/.local and ~/bin (never Desktop, Documents, synchronised folders or network/autofs mounts, not even an existence test there), write a #!/bin/sh script there, chmod 700, run it, remove the directory', 'read ~/.config/user-dirs.dirs (XDG Desktop/Documents)']
"proc.list" = ['run ps -A -o pid= -o ppid= -o uid= -o comm= -o args= (numeric uids; no NSS lookups)', 'read /etc/passwd (names for those uids)', 'read /etc/nsswitch.conf (passwd sources); only when they are all local: fallback ps -A -o ... -o user= ..., then ps -ef', 'Cygwin/MSYS: not run (account names come from Windows)']
"svc.list" = ['run systemctl list-units --type=service --all --no-legend --no-pager, systemctl list-unit-files --type=service --no-legend --no-pager', 'run launchctl list (macOS)', 'run lssrc -a (AIX)', 'run svcs -a (Solaris)', 'list /etc/init.d (fallback)']
"sched.tasks" = ['run crontab -l (own crontab)', 'list /etc/cron.d, /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, /etc/cron.monthly, /Library/LaunchAgents, /Library/LaunchDaemons, ~/Library/LaunchAgents (not on a network or autofs mount)', 'run systemctl list-timers --all --no-pager --no-legend', 'run loginctl show-user <own user> -p Linger']
"virt.platform" = ['read /.dockerenv, /run/.containerenv, /proc/1/cgroup, /proc/self/mountinfo', 'environment KUBERNETES_SERVICE_HOST, container, WSL_DISTRO_NAME', 'read /sys/class/dmi/id/{sys_vendor,product_name}', 'read /proc/cpuinfo (hypervisor flag)', 'run systemd-detect-virt (when present)', 'run sysctl -n kern.hv_vmm_present (macOS)', 'test /dev/kvm, /var/run/docker.sock, $XDG_RUNTIME_DIR/podman/podman.sock']
"virt.engine" = ['run docker --context default info (not when DOCKER_HOST is tcp:// or ssh:// or DOCKER_CONTEXT is set)', 'test podman on PATH (podman info is never run; the version is in tools.inventory)']
"session.context" = ['environment SSH_CONNECTION, SSH_TTY, DISPLAY, WAYLAND_DISPLAY, XDG_SESSION_TYPE, XDG_CURRENT_DESKTOP, TERM', 'test whether stdin, stdout and stderr are terminals (at scan start)']
