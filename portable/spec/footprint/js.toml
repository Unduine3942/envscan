# Footprint of envscan.js (Windows Script Host, cscript.exe): exactly what each probe reads or runs.
# A probe is implemented by envscan.js if and only if it is listed here.
# Vocabulary as in ps.toml. "CIM <class>" is a local WMI query run in the scanner's own cscript
# worker (cscript //T time limit); "registry <key>" is a StdRegProv/RegRead read; "read", "list",
# "test", "write" are FileSystemObject operations; "run <command>" is an external process started
# through %SystemRoot%\System32\cmd.exe /d /c with empty stdin, cwd = %SystemDrive%\, a timeout and
# the process tree stopped on timeout. Links (any reparse point) are never followed.

"os.identity" = ['CIM Win32_OperatingSystem, Win32_ComputerSystem, Win32_Processor', 'registry HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion', 'registry HKLM\SYSTEM\CurrentControlSet\Control\CloudDomainJoin\JoinInfo (subkey names only)']
"os.time_locale" = ['registry HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation (TimeZoneKeyName) and HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Time Zones\<id> (Display); CIM Win32_TimeZone when they are missing', 'registry HKCU\Control Panel\International (LocaleName, Locale, sDecimal, sThousand, sShortDate, sList)', 'registry HKCU\Control Panel\Desktop (PreferredUILanguages), HKCU\Control Panel\Desktop\MuiCached (MachinePreferredUILanguages), HKLM\SYSTEM\CurrentControlSet\Control\Nls\Language (InstallLanguage)', 'registry HKLM\SYSTEM\CurrentControlSet\Control\Nls\Locale (default value) and HKLM\SOFTWARE\Classes\MIME\Database\Rfc1766 (locale names)', 'registry HKLM\SYSTEM\CurrentControlSet\Control\Nls\CodePage', 'registry HKCU\Console (CodePage, VirtualTerminalLevel)']
"os.health" = ['CIM Win32_OperatingSystem (LastBootUpTime), Win32_Processor (LoadPercentage)', 'registry HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending (exists)', 'registry HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired (exists)', 'registry HKLM\SYSTEM\CurrentControlSet\Control\Session Manager (PendingFileRenameOperations, presence only)']
"os.updates" = ['CIM Win32_QuickFixEngineering']
"hw.cpu" = ['CIM Win32_Processor', 'registry HKLM\HARDWARE\DESCRIPTION\System\CentralProcessor\0']
"hw.memory" = ['CIM Win32_OperatingSystem, Win32_PageFileUsage']
"hw.storage" = ['CIM Win32_Volume (local volumes with a drive letter; network drives are never queried for size)', 'registry HKCU\Network and the drive list (mapped network drive letters and targets; not contacted)']
"hw.gpu" = ['CIM Win32_VideoController']
"net.ports" = ['run netsh int ipv4 show excludedportrange protocol=tcp', 'run netsh int ipv4 show dynamicport tcp', 'run netsh http show urlacl']
"user.identity" = ['environment USERNAME, USERDOMAIN, USERDNSDOMAIN, USERPROFILE, LOGONSERVER', 'registry HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList (own entry, found by matching ProfileImagePath; no token API: groups are assumed and elevation is unknown)', 'registry HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System (UAC values)', 'registry HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock (Developer Mode)']
"user.profile" = ['environment USERPROFILE, HOMEDRIVE, HOMEPATH, HOMESHARE, OneDrive, OneDriveCommercial, APPDATA', 'registry HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\<own SID> (State, CentralProfile)', 'registry HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders', 'registry HKLM\SOFTWARE\FSLogix\Profiles', 'test %USERPROFILE%\NTUSER.MAN exists (mandatory profile)']
"user.privileges" = ['run whoami /all', 'run gpresult /r /scope user']
"env.vars" = ['process environment as it was before the scanner changed anything', 'registry HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment', 'registry HKCU\Environment']
"env.path" = ['process PATH, machine and user Path from the registry', 'test each local PATH entry exists (no ACL API in WSH: writability is reported unknown); network paths, and folders that are or lie below a link to one, are not touched']
"shell.info" = ['WScript.Version, ScriptEngine version', 'registry HKLM and HKCU \SOFTWARE\Policies\Microsoft\Windows\PowerShell (all values; EnableScripts, ExecutionPolicy)', 'environment PSExecutionPolicyPreference, __PSLockdownPolicy, ComSpec, PATHEXT', 'registry HKCU and HKLM \SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell (ExecutionPolicy)', 'registry HKLM\SOFTWARE\Microsoft\PowerShell\1 and \3 \PowerShellEngine (installed engines)', 'list %ProgramFiles%\PowerShell (pwsh.exe file versions)', 'registry HKLM and HKCU \Software\Microsoft\Command Processor (AutoRun)', 'registry HKCU and HKLM \Software\Policies\Microsoft\Windows\System (DisableCMD)', 'registry HKLM and HKCU \Software\Microsoft\Windows Script Host\Settings (Enabled, IgnoreUserSettings, TrustPolicy, UseWINSAFER)', 'read file stream envscan.js:Zone.Identifier']
"sec.app_control" = ['registry HKLM\SOFTWARE\Policies\Microsoft\Windows\SrpV2 (AppLocker collections and rule counts)', 'CIM Win32_Service (Name = AppIDSvc)', 'registry HKLM and HKCU \SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers (SRP)', 'CIM root/Microsoft/Windows/DeviceGuard:Win32_DeviceGuard', 'registry HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy (VerifiedAndReputablePolicyState, Smart App Control)', 'registry HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel (MitigationOptions, MitigationAuditOptions)', 'registry HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\<runtime>.exe (MitigationOptions, for 17 runtime and shell executables)', 'registry HKLM\SOFTWARE\Policies\Microsoft\Windows\System (EnableSmartScreen, ShellSmartScreenLevel)', 'registry HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments (SaveZoneInformation)']
"sec.crypto" = ['registry HKLM\SYSTEM\CurrentControlSet\Control\Lsa\FipsAlgorithmPolicy (Enabled only)', 'registry HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols', 'registry HKLM\SOFTWARE\Microsoft\.NETFramework\v2.0.50727 and v4.0.30319, native and WOW6432Node (SchUseStrongCrypto, SystemDefaultTlsVersions)', 'registry HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\WinHttp, native and WOW6432Node (DefaultSecureProtocols)']
"sec.av" = ['CIM root/SecurityCenter2:AntiVirusProduct', 'registry HKLM\SOFTWARE\Policies\Microsoft\Windows Defender (subkeys named *Exclusion*, AllowedApplications or Policy Manager are never opened; values named Exclu* or *Exclusion* are never read)', 'registry HKLM and HKCU \SOFTWARE\Policies (capped at 600 keys each; subkeys named *Exclusion*, AllowedApplications, Policy Manager, Installer, Winlogon or IPSec are never opened; values named Exclu* or *Exclusion* are never read)']
"tls.trust" = ['registry HKLM\SOFTWARE\Microsoft\SystemCertificates\ROOT\Certificates, HKLM\SOFTWARE\Policies\Microsoft\SystemCertificates\Root\Certificates, HKLM\SOFTWARE\Microsoft\EnterpriseCertificates\Root\Certificates, HKLM\SOFTWARE\Microsoft\SystemCertificates\AuthRoot\Certificates (subkey names, and each certificate Blob for subject, issuer and expiry)', 'registry HKCU\Software\Microsoft\SystemCertificates\Root\Certificates and HKCU\Software\Policies\Microsoft\SystemCertificates\Root\Certificates (subkey names and Blobs)', 'registry HKLM\SOFTWARE\Microsoft\SystemCertificates\CA\Certificates and its Policies and EnterpriseCertificates equivalents (subkey names; count only)', 'registry HKLM\SOFTWARE\Policies\Microsoft\SystemCertificates\AuthRoot (DisableRootAutoUpdate)', 'environment TLS variables', 'read size and date of %JAVA_HOME%\lib\security\cacerts']
"tls.java_cacerts" = ['run <jdk>\bin\keytool.exe -list -v -keystore <jdk cacerts> -storepass changeit (the public default password; output is reduced to SHA-1 fingerprints; never a version-manager shim; not run when cacerts is a symbolic link or junction that does not end on a local path that is no credential store)']
"pkg.sources" = ['read package-manager config files from spec/configs.toml (redacted, capped; endpoints are taken from the raw text as scheme://host:port, without userinfo; a path that names a credential store or a reserved device is never tested; a file or folder that is a symbolic link or junction, or lies below a folder that is one, is never read: the Windows Script Host cannot read link targets, so every reparse point counts as a link with an unknown target (noted, partial))', 'environment package variables', "run git config --list --show-origin --no-includes (from the scanner's empty temp folder with GIT_CEILING_DIRECTORIES at its parent, so no repository config is read; when the git home folder (HOME, else HOMEDRIVE+HOMEPATH unless that is a missing local folder, else USERPROFILE), XDG_CONFIG_HOME, GIT_CONFIG_GLOBAL or GIT_CONFIG_SYSTEM is on a network path or is (or lies below) a symbolic link, junction or other reparse point, and also when the home's .gitconfig or the XDG git folder is one, git runs with an empty local folder in the scanner temp folder instead and that configuration is not read (partial, noted); when ProgramData (the system-wide file of Git for Windows) is not a local path or is behind such a link, git runs with GIT_CONFIG_NOSYSTEM=1 (partial, noted); a git without --show-origin or --no-includes runs again without that option)", 'run git config --list --show-origin --no-includes --file <file> for each include.path that names an existing regular file on a local drive (~/ is the git home folder, a relative path is relative to the including file; never a credential store, which is not even tested, a device name, a folder, a cloud placeholder, a link (any reparse point) or a file below a folder that is one; one level only: the includes of that file and every includeIf.<condition>.path are noted, not read)']
"pkg.caches" = ['list cache directories from spec/configs.toml (top-level entry counts, capped; a file or folder that is a symbolic link or junction, or lies below a folder that is one, is never read: the Windows Script Host cannot read link targets, so every reparse point counts as a link with an unknown target (noted, partial))']
"pkg.installed" = ['registry HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall (native and WOW6432Node; per subkey DisplayName, DisplayVersion, Publisher, SystemComponent, ParentKeyName, ReleaseType)', 'registry HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'Store (Appx) packages are not listed (no Windows Script Host source; count unknown, partial)', 'list %ChocolateyInstall%\lib and read each <package>.nuspec version (the same link rule as scoop)', 'list scoop apps (%SCOOP%, ~\scoop, %ProgramData%\scoop) and read current\manifest.json versions (a file or folder that is a symbolic link or junction, or lies below a folder that is one, is never read: the Windows Script Host cannot read link targets, so every reparse point counts as a link with an unknown target (noted, partial))', 'list PSModulePath directories (a root or module folder that is, or lies below, a symbolic link, junction or other reparse point is not listed; a root is noted)']
"pkg.features" = ['CIM Win32_OptionalFeature (InstallState = 1)']
"tools.inventory" = ['list PATH directories and the known install directories in spec/tools.toml (a directory that is, or lies below, a symbolic link, junction or other reparse point is neither tested nor listed)', 'run <tool> <version args> for each found tool that may be run (spec/tools.toml), through %SystemRoot%\System32\cmd.exe /d /c with output redirected to the scanner temp folder; never shims, .ps1 files, WindowsApps aliases, the WSL launcher or a program that is, or lies below, a symbolic link, junction or other reparse point, such as the winget app alias (checked for every program the scanner starts)', 'read the first 4 KB of each found executable (PE machine type; not through such a link)']
"runtime.version_managers" = ['list the version directories in spec/tools.toml (no shim is executed; one folder at a time, never below a symbolic link, junction or other reparse point)', 'environment NVM_SYMLINK']
"runtime.java" = ['environment JAVA_HOME', 'read <jdk>\release for JAVA_HOME, PATH java, JavaSoft registry homes, %ProgramFiles%\{Java,Eclipse Adoptium,Eclipse Foundation,Microsoft,Zulu,Amazon Corretto,BellSoft,Semeru,RedHat,OpenJDK}\* and ~\.jdks\* (a file or folder that is a symbolic link or junction, or lies below a folder that is one, is never read: the Windows Script Host cannot read link targets, so every reparse point counts as a link with an unknown target (noted, partial))', 'registry HKLM\SOFTWARE\JavaSoft (native and WOW6432Node)', 'read the first 4 KB of each java.exe (PE machine type)']
"runtime.dotnet" = ['registry HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP', 'run dotnet --list-sdks', 'run dotnet --list-runtimes', 'list %ProgramFiles%\dotnet\sdk and shared\Microsoft.NETCore.App when dotnet cannot be run']
"runtime.python" = ['list PATH and %LOCALAPPDATA%\Programs\Python\Python*, %ProgramFiles%\Python*, %SystemDrive%\Python*, miniconda/anaconda directories, ~\.pyenv\pyenv-win\versions\*', 'registry HKLM and HKCU \SOFTWARE\Python\PythonCore (native and WOW6432Node)', 'list %LOCALAPPDATA%\Microsoft\WindowsApps (Microsoft Store Python packages)', 'run <python> --version for up to 10 interpreters (never WindowsApps aliases, .bat/.cmd/.ps1 shims or version-manager shim folders)', 'run py -0p (same rules)']
"toolchain.msvc" = ['run "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format text -nologo -utf8', 'registry HKLM\SOFTWARE\Microsoft\Windows Kits\Installed Roots (native and WOW6432Node)', 'list <KitsRoot10>\Include']
"native.deps" = ['registry HKLM\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes (native and WOW6432Node)', 'read file version of %SystemRoot%\System32\ucrtbase.dll (Scripting.FileSystemObject GetFileVersion)', 'registry HKLM and HKCU EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5} (WebView2)', 'registry HKLM\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers (native and WOW6432Node)', 'registry HKLM\SOFTWARE\ORACLE (native and WOW6432Node)']
"net.interfaces" = ['CIM Win32_NetworkAdapterConfiguration (IPEnabled), Win32_NetworkAdapter (NetConnectionID set)', 'CIM root/StandardCimv2:MSFT_NetIPInterface (MTU)']
"net.routes" = ['CIM root/StandardCimv2:MSFT_NetRoute, fallback Win32_IP4RouteTable']
"net.dns" = ['net.interfaces data, or CIM Win32_NetworkAdapterConfiguration (DNS servers and suffixes)', 'registry HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters (SearchList, Domain)', 'registry HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient (values, DnsPolicyConfig count)', 'read %SystemRoot%\System32\drivers\etc\hosts (a file or folder that is a symbolic link or junction, or lies below a folder that is one, is read only when the link ends on a local path that is no credential store; otherwise noted, partial)']
"net.proxy" = ['environment proxy variables', 'registry HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\Connections (WinHttpSettings)', 'registry HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings (ProxyEnable, ProxyServer, ProxyOverride, AutoConfigURL) and \Connections (DefaultConnectionSettings flags)', 'registry HKLM and HKCU \SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\Internet Settings', 'pkg.sources data (the package-manager and git proxy settings it found by their names: key, redacted value, file)']
"net.listening" = ['CIM root/StandardCimv2:MSFT_NetTCPConnection (State = Listen)', 'CIM Win32_Process (names only)']
"net.netstat" = ['run netstat -ano']
"net.firewall" = ['CIM root/StandardCimv2:MSFT_NetFirewallProfile', 'registry HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\{Domain,Standard,Public}Profile (EnableFirewall, default actions)']
"net.reachability" = ['net.proxy and pkg.sources data only: no DNS lookup and no TCP connect (JScript has no resolver or socket without extra COM objects; not_applicable, use envscan.ps1 or envscan.sh); lists the at most 20 proxy and mirror endpoints that envscan.ps1 would check, and the ones it never contacts with its reason (public registries from spec public_hosts, cloud metadata or link-local hosts and addresses from spec net_never, other IPv4 addresses than 10/8, 172.16/12, 192.168/16 and 100.64/10, IPv6 addresses outside 2000::/3 and fc00::/7 or in fd00:ec2::/32)']
"fs.locations" = ['create and delete one new temporary file in %TEMP%, %LOCALAPPDATA%, %LOCALAPPDATA%\Programs, %APPDATA%, %USERPROFILE%, %ProgramData%, the current directory and the script directory (never on network paths or below a link to one)', 'registry HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders (Desktop, Documents): candidates there or in OneDrive get no test file', '%SystemDrive%\ and %ProgramFiles%: nothing is written; their writability is unknown (JScript cannot read directory ACLs; partial)', 'hw.storage data (free space, file system)']
"fs.semantics" = ['write and delete test files in the scanner temp folder (case sensitivity)', 'run cmd /d /c mklink /H, mklink /J and mklink <link> <target> in the scanner temp folder (hard link, junction and symbolic link tests)', 'registry HKLM\SYSTEM\CurrentControlSet\Control\FileSystem (LongPathsEnabled, NtfsDisable8dot3NameCreation)']
"fs.exec_test" = ['create a new .cmd and a new .ps1 file in each writable per-user location (%TEMP%, %LOCALAPPDATA%, %LOCALAPPDATA%\Programs, %APPDATA%, %USERPROFILE%) and run them (cmd /d /c <file>, powershell -NoProfile -NonInteractive -File <file>; the execution policy is not changed), then always delete them']
"proc.list" = ['CIM Win32_Process (name, ids, path; command lines are only visible for own processes and are redacted)']
"svc.list" = ['CIM Win32_Service']
"sched.tasks" = ['CIM root/Microsoft/Windows/TaskScheduler:MSFT_ScheduledTask (non-Microsoft tasks listed, Microsoft tasks counted)']
"virt.platform" = ['CIM Win32_ComputerSystem, Win32_BIOS', 'registry HKLM\SYSTEM\CurrentControlSet\Control (ContainerType)', 'registry HKCU\Software\Microsoft\Windows\CurrentVersion\Lxss (WSL distributions)', 'test %ProgramFiles%\Docker\Docker\Docker Desktop.exe exists (the docker_engine named pipe cannot be tested from WSH: unknown)', 'pkg.features data (Hyper-V, WSL and container features)']
"virt.engine" = ['run docker --context default info (the local default engine only; not run when DOCKER_HOST points elsewhere than a local named pipe)', 'podman: version from tools.inventory only (podman info may connect over ssh)']
"session.context" = ['environment SESSIONNAME, WT_SESSION, TERM_PROGRAM, ConEmuANSI, SSH_CONNECTION', 'registry HKCU\Volatile Environment (session subkey names)', 'WScript.FullName', 'hw.gpu data (resolution)', 'registry HKCU\Control Panel\Desktop (LogPixels)']
